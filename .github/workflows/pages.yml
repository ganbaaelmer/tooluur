name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Зөвхөн сайтад хэрэгтэй файлыг цуглуулна.
      # Ингэснээр .env, дотоод бичиг баримт зэрэг санамсаргүйгээр нээлттэй болохгүй.
      - name: Сайтын файлуудыг цуглуулах
        run: |
          mkdir -p _site/icons _site/fonts
          cp index.html app.css app.js sw.js manifest.webmanifest _site/
          cp icons/icon.svg icons/*.png _site/icons/
          cp fonts/*.woff2 _site/fonts/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
          ls -laR _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
